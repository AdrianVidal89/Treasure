# Los tres servicios de Python comparten una imagen propia (Dockerfile) que ya
# trae el cliente de PostgreSQL y las dependencias. Antes cada contenedor los
# instalaba al arrancar, los tres a la vez y sin techo de memoria, y eso dejó
# colgado el NAS (3,7 GB de RAM) el 13-nov-2026. El código sigue montado por
# volumen; deploy.sh reconstruye la imagen (solo cambia si cambia
# requirements.txt o el Dockerfile) antes de recrear los contenedores.
services:
  db:
    image: postgres:16-alpine
    restart: always
    mem_limit: 512m
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasure_user -d treasure_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: treasure-app:latest
    restart: always
    mem_limit: 768m
    working_dir: /app
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env
    ports:
      - "8181:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 300"

  # Actualiza las cotizaciones de las inversiones cada hora (y completa el
  # histórico de cierres de la gráfica de evolución), aunque nadie abra la app.
  precios:
    image: treasure-app:latest
    restart: always
    mem_limit: 384m
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: >
      python manage.py actualizar_precios --cada 3600

  # Copia automática de la base de datos a Google Drive. Comprueba cada 5 min
  # si toca según lo configurado en Panel Admin > Copias de seguridad.
  copias:
    image: treasure-app:latest
    restart: always
    mem_limit: 384m
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: >
      python manage.py copias_drive --cada 300
